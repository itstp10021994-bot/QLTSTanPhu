<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sơ đồ tính năng QLTS Tân Phú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sơ đồ tư duy cổ điển – nút trung tâm, 8 nhánh cong tỏa hai bên (chức năng → thao tác), kéo/zoom được */
:root {
  --bg: #f6f7fb;
  --paper: #ffffff;
  --ink: #18213a;
  --muted: #5d6882;
  --line: #d9deea;
  --hub: #1d4ed8;
  --on-hub: #ffffff;
  --on-branch: #ffffff;
  --b1: #2a78d6; --b2: #1d4ed8; --b3: #12a06c; --b4: #e05f2a;
  --b5: #5b48c4; --b6: #0b8a3a; --b7: #c48600; --b8: #cf4f86;
  --f: "Be Vietnam Pro", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131f; --paper: #151c2c; --ink: #e7ecf6; --muted: #9ba7c0; --line: #2a3450;
    --hub: #7aa2ff; --on-hub: #0e131f; --on-branch: #0e131f;
    --b1: #62a6f2; --b2: #7aa2ff; --b3: #3fd09b; --b4: #f5915f;
    --b5: #a596f5; --b6: #52c96f; --b7: #f2bd45; --b8: #f290bb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131f; --paper: #151c2c; --ink: #e7ecf6; --muted: #9ba7c0; --line: #2a3450;
  --hub: #7aa2ff; --on-hub: #0e131f; --on-branch: #0e131f;
  --b1: #62a6f2; --b2: #7aa2ff; --b3: #3fd09b; --b4: #f5915f;
  --b5: #a596f5; --b6: #52c96f; --b7: #f2bd45; --b8: #f290bb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 14px; display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-inline: 16px; padding-block: 12px; }
.bar h1 { margin: 0; font-size: 1.15rem; font-weight: 800; text-wrap: balance; }
.bar p { margin: 2px 0 0; color: var(--muted); font-size: .82rem; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools button { font: inherit; font-size: .82rem; font-weight: 600; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 11px; cursor: pointer; }
.tools button:hover { border-color: var(--hub); }
.tools button[aria-pressed="true"] { background: var(--hub); color: var(--on-hub); border-color: var(--hub); }
.tools button:focus-visible { outline: 2px solid var(--hub); outline-offset: 2px; }
.stage { flex: 1; min-height: 420px; position: relative; margin-inline: 16px; margin-bottom: 12px; background: var(--paper);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
.stage svg.drag { cursor: grabbing; }
/* SVG */
.edge { fill: none; stroke-linecap: round; }
.t-branch { font-weight: 700; font-size: 16px; fill: var(--on-branch); }
.t-role { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.t-feat { font-weight: 700; font-size: 14.5px; fill: var(--ink); }
.t-leaf { font-size: 13px; fill: var(--ink); }
.t-hub1 { font-weight: 800; font-size: 19px; fill: var(--on-hub); letter-spacing: .02em; }
.t-hub2 { font-size: 12.5px; fill: var(--on-hub); opacity: .9; }
.bnode { cursor: pointer; }
.bnode:focus-visible rect { stroke: var(--ink); stroke-width: 2.5; }
.bnode .more { font-size: 12px; font-weight: 700; fill: var(--on-branch); }
@media print { .bar .tools { display: none; } .stage { border: 0; } }
</style>
</head>
<body>

<div class="bar">
  <div>
    <h1>Sơ đồ tính năng QLTS Tân Phú</h1>
    <p>Nhánh menu → chức năng → thao tác · Kéo để di chuyển, cuộn chuột hoặc chụm hai ngón để phóng to, bấm vào nhánh để thu gọn</p>
  </div>
  <div class="tools" role="toolbar" aria-label="Điều khiển sơ đồ">
    <button id="btn-steps" aria-pressed="true">Hiện thao tác</button>
    <button id="btn-fit">Vừa màn hình</button>
    <button id="btn-in" aria-label="Phóng to">＋</button>
    <button id="btn-out" aria-label="Thu nhỏ">－</button>
  </div>
</div>
<div class="stage" id="stage">
  <svg id="map" role="img" aria-label="Sơ đồ tư duy các tính năng của ứng dụng quản lý thiết bị"></svg>
</div>

<script>
const TREE = [
  { t: "Đăng nhập & Tài khoản", role: "Mọi người dùng", c: "--b1", kids: [
    { t: "Đăng nhập bằng mã OTP", kids: ["Nhập email @igcschool.edu.vn / @igc.edu.vn", "Bấm gửi mã → mở email lấy mã", "Nhập mã → vào app (tự ghi nhớ)"] },
    { t: "Nút Tài khoản (góc phải)", kids: ["Làm mới dữ liệu từ SharePoint", "Đăng xuất khi dùng máy chung"] },
    { t: "Trang chủ", kids: ["Xem số liệu tổng quan", "Bấm ô lối tắt để mở chức năng"] },
  ]},
  { t: "Ban quản lý tài sản", role: "Ban quản lý tài sản", c: "--b2", kids: [
    { t: "Danh sách thiết bị", kids: ["Lọc, chọn cột hiển thị", "Sửa trực tiếp trong bảng → Lưu", "Bật “Hiện cả tài sản đã thanh lý”", "Tải toàn bộ danh sách (Excel)"] },
    { t: "Nhập / xuất Excel", kids: ["Tải file mẫu → điền dữ liệu", "Tải file lên → xem trước thay đổi", "Nhập vào SharePoint (chỉ ghi ô khác)"] },
    { t: "Nhập mới thiết bị", kids: ["Chọn Mã tài sản có sẵn hoặc tạo mới", "Chọn nơi sử dụng, nhóm, giá, ngày mua", "Nhập số lượng → Lưu (tự sinh mã chi tiết)"] },
    { t: "Chỉnh sửa thiết bị", kids: ["Bấm vào dòng → popup chỉnh sửa", "Sửa → Lưu thay đổi", "Xóa thiết bị này → xác nhận"] },
    { t: "Điều chuyển thiết bị", kids: ["Chọn Từ nơi sử dụng, tick thiết bị", "Chọn Đến nơi, ngày → Điều chuyển", "Chọn người giao / nhận → biên bản Word, PDF"] },
  ]},
  { t: "Bàn giao", role: "Ban quản lý tài sản", c: "--b3", kids: [
    { t: "Tài sản hiện có", kids: ["Lọc vị trí, nhóm tài sản", "Gom theo mã tài sản, cộng số lượng", "Đối chiếu với tổng trên SharePoint"] },
    { t: "Xuất biên bản bàn giao", kids: ["Chọn phòng, ngày bàn giao", "Chọn thành viên bên giao", "Sửa ngày riêng cho từng phòng", "Excel: 1 phòng/sheet · PDF: 1 phòng/trang"] },
  ]},
  { t: "Thanh lý", role: "Ban quản lý tài sản", c: "--b4", kids: [
    { t: "Lập thanh lý", kids: ["Đặt tên đợt, số tờ trình", "Tick tài sản → Thêm vào danh sách", "Sửa giá trị còn lại, bỏ dòng nhầm"] },
    { t: "In biểu mẫu", kids: ["Kế hoạch thanh lý (Excel, PDF)", "Tờ trình phê duyệt (Word, PDF)"] },
    { t: "Xác nhận thanh lý", kids: ["Bấm Xác nhận thanh lý → đồng ý", "Tài sản thành “Đã thanh lý”, ẩn khỏi danh sách"] },
    { t: "Tra cứu", kids: ["Các đợt thanh lý → tải Excel", "Danh sách tài sản đã thanh lý"] },
  ]},
  { t: "Ban kiểm kê", role: "Ban kiểm kê", c: "--b5", kids: [
    { t: "Chọn đợt & phòng", kids: ["Chọn đợt có sẵn hoặc tạo đợt mới", "Chọn nơi sử dụng", "Chọn phương án riêng cho từng phòng"] },
    { t: "Nhập số lượng", kids: ["Nhập số thực tế, tình trạng, ghi chú", "Lưu tạm hoặc Xác nhận kiểm kê"] },
    { t: "Quét mã QR", kids: ["Tải tem QR (PDF 24 tem/trang) → dán", "Quét bằng camera (đèn, zoom)", "Hoặc máy quét QR vào ô nhập mã", "Bỏ mã quét nhầm → Xác nhận kiểm kê"] },
    { t: "Kết quả kiểm kê", kids: ["Chọn đợt → xem các phòng", "Tải Excel"] },
  ]},
  { t: "Người dùng", role: "Mọi người dùng", c: "--b6", kids: [
    { t: "Phòng đang quản lý", kids: ["Xem thiết bị phòng mình", "Tải danh sách (Excel)"] },
    { t: "Xác nhận kiểm kê phòng", kids: ["Chọn đợt, phòng", "Đồng ý / Không đồng ý (+ ghi chú)", "Bấm Gửi xác nhận"] },
  ]},
  { t: "Báo cáo", role: "Ban giám hiệu · QLTS", c: "--b7", kids: [
    { t: "Bộ lọc", kids: ["Nhóm thiết bị, nơi sử dụng"] },
    { t: "4 chỉ số", kids: ["Đang dùng · Tổng giá trị", "Cần sửa / thanh lý · Đã thanh lý"] },
    { t: "6 tab · 12 bảng", kids: ["Nhóm & tình trạng", "Nơi sử dụng & người quản lý", "Loại tài sản · Thời gian & giá trị", "Kiểm kê – Điều chuyển – Thanh lý", "Chất lượng dữ liệu"] },
    { t: "Biểu đồ", kids: ["Cột · Tròn · Đường"] },
    { t: "Xuất Excel", kids: ["Toàn bộ báo cáo, mỗi bảng 1 sheet"] },
  ]},
  { t: "Phân quyền", role: "Quản trị hệ thống", c: "--b8", kids: [
    { t: "Phân quyền admin", kids: ["Thêm email + vai trò", "Bấm dòng để sửa vai trò", "Tick → thu hồi quyền"] },
    { t: "Quản lý phòng", kids: ["Thêm phòng, người quản lý", "Đổi quản lý → tự đồng bộ thiết bị", "Đồng bộ thiết bị bị lệch"] },
    { t: "Xuất / nhập biểu mẫu", kids: ["Tải mẫu, xuất dữ liệu 6 list", "Nhập file → chỉ ghi ô thay đổi", "Đối chiếu dòng trùng / thừa"] },
    { t: "Kết nối SharePoint", kids: ["Kiểm tra truy cập · Ghi thử 1 dòng", "Gửi thử email", "Tạo list còn thiếu"] },
  ]},
];
const RIGHT = [0, 1, 2, 3], LEFT = [4, 5, 6, 7];

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const cvs = document.createElement("canvas").getContext("2d");
const FONT = getComputedStyle(document.body).fontFamily;
const measure = (txt, size, weight) => { cvs.font = `${weight} ${size}px ${FONT}`; return cvs.measureText(txt).width; };
const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };

let showSteps = true;
const collapsed = new Set();
try { const s = JSON.parse(localStorage.getItem("qlts-map") || "{}"); if (s.steps === false) showSteps = false; } catch (e) {}

const LEAF_H = 27, FEAT_GAP = 12, BR_GAP = 34, HUB_W = 236, HUB_H = 84;

function layoutSide(idxs, dir) {
  let y = 0; const out = [];
  for (const i of idxs) {
    const b = TREE[i], open = showSteps && !collapsed.has(i), feats = [];
    for (const f of b.kids) {
      const leaves = [];
      if (open) for (const t of f.kids) { leaves.push({ t, y }); y += LEAF_H; }
      else y += LEAF_H;
      const fy = open ? (leaves[0].y + leaves[leaves.length - 1].y) / 2 : y - LEAF_H;
      feats.push({ f, y: fy, leaves });
      y += open ? FEAT_GAP : 4;
    }
    out.push({ i, b, y: (feats[0].y + feats[feats.length - 1].y) / 2, feats });
    y += BR_GAP;
  }
  const shift = (y - BR_GAP) / 2;
  for (const br of out) { br.y -= shift; for (const fe of br.feats) { fe.y -= shift; for (const l of fe.leaves) l.y -= shift; } }
  return out;
}

function curve(x1, y1, x2, y2) {
  const mx = (x1 + x2) / 2;
  return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
}

let bbox = null;
function render() {
  svg.replaceChildren();
  const gRoot = el("g", { id: "root" }, svg);
  const gEdges = el("g", {}, gRoot), gNodes = el("g", {}, gRoot);
  let minX = -HUB_W / 2, maxX = HUB_W / 2, minY = -HUB_H / 2, maxY = HUB_H / 2;

  for (const [idxs, dir] of [[RIGHT, 1], [LEFT, -1]]) {
    for (const br of layoutSide(idxs, dir)) {
      const col = `var(${br.b.c})`;
      const bw = measure(br.b.t, 16, 700) + 34, bh = 36;
      const bx = dir * (HUB_W / 2 + 70);              // mép trong của nhánh
      const bOuter = bx + dir * bw;
      el("path", { class: "edge", d: curve(dir * (HUB_W / 2 - 18), 0, bx, br.y), stroke: col, "stroke-width": 7 }, gEdges);

      const g = el("g", { class: "bnode", tabindex: 0, role: "button", "aria-label": `${br.b.t}: bấm để thu gọn hoặc mở` }, gNodes);
      el("rect", { x: Math.min(bx, bOuter), y: br.y - bh / 2, width: bw, height: bh, rx: 18, fill: col }, g);
      const tt = el("text", { class: "t-branch", x: (bx + bOuter) / 2, y: br.y + 5.5, "text-anchor": "middle" }, g); tt.textContent = br.b.t;
      const rt = el("text", { class: "t-role", x: (bx + bOuter) / 2, y: br.y + bh / 2 + 15, "text-anchor": "middle", fill: col }, gNodes); rt.textContent = br.b.role;
      const toggle = () => { collapsed.has(br.i) ? collapsed.delete(br.i) : collapsed.add(br.i); render(); };
      g.addEventListener("click", e => { if (!moved) toggle(); });
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

      for (const fe of br.feats) {
        const fw = measure(fe.f.t, 14.5, 700) + 14;
        const fx = bOuter + dir * 46, fOuter = fx + dir * fw;
        el("path", { class: "edge", d: curve(bOuter, br.y, fx, fe.y), stroke: col, "stroke-width": 3.2 }, gEdges);
        el("path", { class: "edge", d: `M${fx},${fe.y} L${fOuter},${fe.y}`, stroke: col, "stroke-width": 3.2 }, gEdges);
        const ft = el("text", { class: "t-feat", x: dir > 0 ? fx + 6 : fx - 6, y: fe.y - 6, "text-anchor": dir > 0 ? "start" : "end" }, gNodes); ft.textContent = fe.f.t;
        let edgeX = fOuter;
        if (!fe.leaves.length && !showSteps) {}
        for (const l of fe.leaves) {
          const lw = measure(l.t, 13, 400) + 10;
          const lx = fOuter + dir * 34, lOuter = lx + dir * lw;
          el("path", { class: "edge", d: curve(fOuter, fe.y, lx, l.y), stroke: col, "stroke-width": 1.4, opacity: .75 }, gEdges);
          el("path", { class: "edge", d: `M${lx},${l.y} L${lOuter},${l.y}`, stroke: col, "stroke-width": 1.4, opacity: .75 }, gEdges);
          const lt = el("text", { class: "t-leaf", x: dir > 0 ? lx + 5 : lx - 5, y: l.y - 5, "text-anchor": dir > 0 ? "start" : "end" }, gNodes); lt.textContent = l.t;
          edgeX = dir > 0 ? Math.max(edgeX, lOuter) : Math.min(edgeX, lOuter);
          minY = Math.min(minY, l.y - 22); maxY = Math.max(maxY, l.y + 6);
        }
        if (dir > 0) maxX = Math.max(maxX, edgeX, fOuter); else minX = Math.min(minX, edgeX, fOuter);
        minY = Math.min(minY, fe.y - 26); maxY = Math.max(maxY, fe.y + 8);
      }
      minY = Math.min(minY, br.y - 24); maxY = Math.max(maxY, br.y + 40);
    }
  }
  // Nút trung tâm
  const hub = el("g", {}, gNodes);
  el("rect", { x: -HUB_W / 2, y: -HUB_H / 2, width: HUB_W, height: HUB_H, rx: 22, fill: "var(--hub)" }, hub);
  const h1 = el("text", { class: "t-hub1", x: 0, y: -6, "text-anchor": "middle" }, hub); h1.textContent = "QUẢN LÝ THIẾT BỊ";
  const h2 = el("text", { class: "t-hub2", x: 0, y: 18, "text-anchor": "middle" }, hub); h2.textContent = "Trường TH‑THCS‑THPT Tân Phú";

  const pad = 30;
  bbox = { x: minX - pad, y: minY - pad, w: maxX - minX + pad * 2, h: maxY - minY + pad * 2 };
  if (!view) fit(); else apply();
}

// ---- Kéo / phóng to ----
let view = null, moved = false;
function apply() { svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); }
function fit() {
  const r = svg.getBoundingClientRect(), ar = r.width / Math.max(r.height, 1);
  let w = bbox.w, h = bbox.h;
  if (w / h > ar) h = w / ar; else w = h * ar;
  view = { x: bbox.x - (w - bbox.w) / 2, y: bbox.y - (h - bbox.h) / 2, w, h };
  apply();
}
function zoom(f, cx, cy) {
  const r = svg.getBoundingClientRect();
  const px = cx === undefined ? .5 : (cx - r.left) / r.width, py = cy === undefined ? .5 : (cy - r.top) / r.height;
  const nw = Math.min(Math.max(view.w * f, 200), bbox.w * 4), k = nw / view.w;
  view.x += view.w * px * (1 - k); view.y += view.h * py * (1 - k); view.w *= k; view.h *= k; apply();
}
svg.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
const pts = new Map(); let last = null, pinch = null;
svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); last = e; moved = false; svg.classList.add("drag"); });
svg.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, e);
  const r = svg.getBoundingClientRect();
  if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinch) zoom(pinch / d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    pinch = d; moved = true; return;
  }
  const dx = e.clientX - last.clientX, dy = e.clientY - last.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
  view.x -= dx * view.w / r.width; view.y -= dy * view.h / r.height; last = e; apply();
});
const up = e => { pts.delete(e.pointerId); pinch = null; if (!pts.size) svg.classList.remove("drag"); else last = [...pts.values()][0]; };
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);

const bSteps = document.getElementById("btn-steps");
const syncSteps = () => bSteps.setAttribute("aria-pressed", String(showSteps));
bSteps.onclick = () => { showSteps = !showSteps; collapsed.clear(); syncSteps(); try { localStorage.setItem("qlts-map", JSON.stringify({ steps: showSteps })); } catch (e) {} render(); fit(); };
document.getElementById("btn-fit").onclick = fit;
document.getElementById("btn-in").onclick = () => zoom(1 / 1.25);
document.getElementById("btn-out").onclick = () => zoom(1.25);
addEventListener("resize", () => bbox && fit());

syncSteps(); render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { render(); fit(); });
</script>
</body>
</html>
