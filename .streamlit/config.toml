[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#eaf0f8"
textColor = "#1e293b"
borderColor = "#dfe5ee"
linkColor = "#1d4ed8"
font = "Be Vietnam Pro:https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap, sans-serif"
baseFontSize = 15
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#f1f5fb"
metricValueFontWeight = 700
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[server]
headless = true

[browser]
gatherUsageStats = false
